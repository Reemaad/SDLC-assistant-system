# A hash sign starts a comment. The computer ignores these lines.
# This file lists every container that makes up our system.

# Everything below "services" is one running piece of software.
services:

  # Our own Report service.
  report:
    # Build an image from the Dockerfile in this folder, instead of downloading one.
    build: ./service/report
    container_name: sdlc-report
    # Connect port 8080 on your laptop to port 8080 inside the container.
    # The left number is your laptop. The right number is inside the box.
    ports:
      - "8084:8080"
    environment:
      PORT: "8080"
    # If the container stops because of a crash, start it again.
    restart: unless-stopped

  # Our Capacity Analysis service.
  capacity-analysis:
    # Build an image from the Dockerfile in the capacity_analysis folder.
    build: ./service/capacity_analysis
    # Give the running container a fixed, readable name.
    container_name: sdlc-capacity-analysis
    # Connect port 8081 on your laptop to port 8080 inside the container.
    # The service listens on 8080 internally, but laptops access it through 8081.
    ports:
      - "8083:8080"
    # Tell the Node.js program which internal port to listen on.
    environment:
      PORT: "8083"
    # If the container stops because of a crash, start it again.
    restart: unless-stopped

  # The Jira integration service. publisher.
  jira-integration:
    build: ./service/jira_integration
    container_name: sdlc-jira-integration


  # NEW: It listens all day, so it starts with everything else.
  core:
    build: ./service/core
    ports:
      - "8080-8082:8080"
    environment:
      SESSION_STORE: "redis"
      PORT: "8080"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: sdlc-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

   